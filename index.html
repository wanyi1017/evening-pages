    /* =====================================================================
       BACKUP AND RESTORE
       ===================================================================== */
    function downloadBackup() {
      const backup = { app: "Evening Pages", version: 1, exportedAt: new Date().toISOString(), entries: data.entries, prefs: data.prefs };
      const blob = new Blob([JSON.stringify(backup, null, 2)], { type: "application/json" });
      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");
      link.href = url;
      link.download = `evening-pages-backup-${todayKey()}.json`;
      document.body.appendChild(link);
      link.click();
      link.remove();
      setTimeout(() => URL.revokeObjectURL(url), 1000);
      showToast("Backup saved to your downloads");
    }

    // Check one entry from a backup file and keep only the parts that look right.
    function cleanEntry(day, raw) {
      if (!/^\d{4}-\d{2}-\d{2}$/.test(day) || !raw || typeof raw !== "object") return null;
      const entry = {
        mood: Number.isInteger(raw.mood) && raw.mood >= 1 && raw.mood <= 5 ? raw.mood : null,
        answers: {},
        updatedAt: Number(raw.updatedAt) || 0,
      };
      for (const [id, answer] of Object.entries(raw.answers || {})) {
        if (id === "__proto__" || !answer || typeof answer.text !== "string" || !answer.text.trim()) continue;
        entry.answers[id] = { question: typeof answer.question === "string" ? answer.question : "", text: answer.text };
      }
      if (raw.demo) entry.demo = true;
      if (raw.released) entry.released = true;
      if (Array.isArray(raw.releasedAnswers)) {
        entry.releasedAnswers = raw.releasedAnswers
          .filter((a) => a && typeof a.text === "string" && a.text.trim())
          .map((a) => ({ question: typeof a.question === "string" ? a.question : "", text: a.text }));
      }
      return hasContent(entry) ? entry : null;
    }

    // Merge a backup in, keeping whichever version of each day was edited most recently.
    function restoreBackup(text) {
      let backup;
      try {
        backup = JSON.parse(text);
      } catch (error) {
        backup = null;
      }
      if (!backup || typeof backup.entries !== "object" || backup.entries === null) {
        showToast("That file doesn't look like an Evening Pages backup.");
        return;
      }
      let added = 0, updated = 0;
      for (const [day, raw] of Object.entries(backup.entries)) {
        const incoming = cleanEntry(day, raw);
        if (!incoming) continue;
        const existing = data.entries[day];
        if (!existing) {
          data.entries[day] = incoming;
          added++;
        } else if (incoming.updatedAt > (existing.updatedAt || 0)) {
          data.entries[day] = incoming;
          updated++;
        }
      }
      const knownIds = new Set(allPrompts().map((p) => p.id));
      for (const p of backup.prefs?.customPrompts || []) {
        if (p && typeof p.id === "string" && typeof p.text === "string" && p.text.trim() && !knownIds.has(p.id)) {
          data.prefs.customPrompts.push({ id: p.id, text: p.text.trim(), hint: "" });
        }
      }
      saveData();
      renderInsights();
      showToast(`Restored: ${added} new, ${updated} updated`);
    }

          "Not sleeping well. Everything feels harder.",
          "Worried about the exam and about home.",
          "I feel like everyone else has it figured out except me.",
          "最近压力很大，总觉得时间不够用。",
        ],
        "g-okay": [
          "The soup at dinner was warm and good.",
          "My friend texted me a funny video.",
          "I made it to class.",
          "It stopped raining for my walk home.",
          "I finished one small assignment.",
          "听到一首很喜欢的歌。",
        ],
        "g-help": [
          "Going to bed early tonight.",
          "Making a short list for tomorrow instead of a long one.",
          "Taking a walk before starting homework.",
          "Eating something warm.",
          "Telling one person how I actually feel.",
          "明天给自己留一点休息的时间。",
        ],
        "g-lean": [
          "Maya. I could tell her how I've been feeling.",
          "My sister, maybe a call this weekend.",
          "The counseling center has walk-in hours.",
          "My roommate, who always asks how my day was.",
          "妈妈，周末可以给她打个电话。",
        ],
        "g-friend": [
          "That it's okay to have a hard week. It doesn't mean you're failing.",
          "You're doing more than you think. Rest is allowed.",
          "This feeling won't last forever.",
          "You don't have to carry all of it at once.",
          "慢慢来，你已经很努力了。",
        ],
      },
    };

    // How often each prompt gets a demo answer: the ones on by default
    // are answered most evenings, the others now and then.
    const DEMO_ANSWER_CHANCE = { happy: 0.8, grateful: 0.75, proud: 0.65, differently: 0.55, tomorrow: 0.7 };

    function isRealEntry(day) { return !!data.entries[day] && !data.entries[day].demo; }

    function demoAnswer(promptId, list) {
      const prompt = allPrompts().find((p) => p.id === promptId) || SETTINGS.gentlePrompts.find((p) => p.id === promptId);
      return { question: prompt.text, text: randomItem(list) };
    }

    function addDemoEntries() {
      const today = todayKey();
      let added = 0;
      for (let daysAgo = 42; daysAgo >= 1; daysAgo--) {
        const day = addDays(today, -daysAgo);
        if (isRealEntry(day) || Math.random() < 0.15) continue; // skip some days, like real life
        // Moods drift slowly up and down, a little brighter on weekends.
        const weekday = keyToDate(day).getDay();
        const weekend = weekday === 0 || weekday === 6 ? 0.5 : 0;
        const drift = 3.3 + Math.sin(daysAgo / 6) * 0.9 + weekend + (Math.random() * 2 - 1);
        const mood = Math.min(5, Math.max(1, Math.round(drift)));

        const answers = {};
        for (const prompt of SETTINGS.prompts) {
          if (Math.random() < (DEMO_ANSWER_CHANCE[prompt.id] || 0.2)) answers[prompt.id] = demoAnswer(prompt.id, DEMO_TEXT[prompt.id]);
        }
        if (mood >= 4 && Math.random() < 0.6) answers.energy = demoAnswer("energy", DEMO_TEXT.brightEnergy);
        data.entries[day] = { mood, answers, updatedAt: Date.now(), demo: true };
        added++;
      }
      saveData();
      renderInsights();
      showToast(`Added ${added} demo pages`);
    }

    function addHeavyWeek() {
      const today = todayKey();
      const moods = [2, 1, 2, 2, 1, 2, 1];
      let added = 0;
      for (let daysAgo = 7; daysAgo >= 1; daysAgo--) {
        const day = addDays(today, -daysAgo);
        if (isRealEntry(day)) continue;
        const answers = {};
        for (const [id, list] of Object.entries(DEMO_TEXT.heavy)) {
          if (Math.random() < 0.75) answers[id] = demoAnswer(id, list);
        }
        data.entries[day] = { mood: moods[7 - daysAgo], answers, updatedAt: Date.now(), demo: true };
        added++;
      }
      delete data.ui.checkinSnoozeUntil; // so the check-in card can show right away
      saveData();
      renderInsights();
      showToast(`Added a heavy week (${added} demo pages). Open Today to see the check-in.`);
    }

    function removeDemoEntries() {
      let removed = 0;
      for (const day of Object.keys(data.entries)) {
        if (data.entries[day].demo) {
          delete data.entries[day];
          removed++;
        }
      }
      saveData();
      renderInsights();
      showToast(removed ? `Removed ${removed} demo pages` : "There were no demo pages to remove");
    }

    /* =====================================================================
       EVENTS
       One listener per event type handles every button, using the
       data-action attribute to decide what to do.
       ===================================================================== */
    const RENDERERS = {
      today: renderToday,
      history: renderHistory,
      insights: renderInsights,
      prompts: renderPrompts,
      entry: renderEntry,
    };

    const ACTIONS = {
      "tab": (button) => showView(button.dataset.tab),
      "back": () => showView(currentTab),
      "pick-mood": (button) => pickMood(Number(button.dataset.mood)),
      "gentle-on": () => setGentle(true),
      "gentle-off": () => setGentle(false),
      "checkin-snooze": () => {
        data.ui.checkinSnoozeUntil = addDays(todayKey(), SETTINGS.checkin.snoozeDays);
        saveData();
        rerenderKeepingScroll(renderToday);
      },
      "memory-next": () => {
        const today = todayKey();
        const index = data.ui.memory?.date === today ? data.ui.memory.index : 0;
        data.ui.memory = { date: today, index: index + 1 };
        saveData();
        rerenderKeepingScroll(renderToday);
      },
      "memory-hide": () => {
        data.ui.memoryHiddenOn = todayKey();
        saveData();
        rerenderKeepingScroll(renderToday);
      },
      "inside-card": () => {},
      "appearance-toggle": () => {
        appearanceOpen = !appearanceOpen;
        rerenderKeepingScroll(renderToday);
      },
      "set-theme": (button) => setTheme(button.dataset.theme),
      "idea-next": () => {
        const today = todayKey();
        const index = data.ui.idea?.date === today ? data.ui.idea.index : 0;
        data.ui.idea = { date: today, index: index + 1 };
        saveData();
        rerenderKeepingScroll(renderToday);
      },
      "idea-hide": () => {
        data.ui.ideaHiddenOn = todayKey();
        saveData();
        rerenderKeepingScroll(renderToday);
      },
      "done": finishToday,
      "release": releaseTonight,
      "open-prompts": () => { promptError = ""; showView("prompts"); },
      "remove-prompt": (button) => removeCustomPrompt(button.dataset.id),
      "filter-mood": (button) => {
        const level = Number(button.dataset.mood);
        historyMood = historyMood === level ? null : level;
        renderHistory();
      },
      "open-entry": (button) => openEntry(button.dataset.date),
      "delete-entry": deleteEntry,
      "cal-prev": () => changeMonth(-1),
      "cal-next": () => changeMonth(1),
      "backup-save": downloadBackup,
      "demo-add": addDemoEntries,
      "demo-heavy": addHeavyWeek,
      "demo-remove": removeDemoEntries,
    };

    document.addEventListener("click", (event) => {
      const button = event.target.closest("[data-action]");
      if (button && ACTIONS[button.dataset.action]) ACTIONS[button.dataset.action](button);
    });

    document.addEventListener("input", (event) => {
      if (event.target.matches("textarea[data-prompt-id]")) onAnswerInput(event.target);
      if (event.target.id === "history-search") {
        historyQuery = event.target.value;
        renderHistoryList();
      }
    });

    document.addEventListener("change", (event) => {
      const target = event.target;
      if (target.dataset.togglePrompt) togglePrompt(target.dataset.togglePrompt, target.checked);
      if (target.id === "restore-file" && target.files[0]) {
        const reader = new FileReader();
        reader.onload = () => restoreBackup(reader.result);
        reader.readAsText(target.files[0]);
      }
    });

    document.addEventListener("submit", (event) => {
      if (event.target.id === "add-prompt-form") {
        event.preventDefault();
        addCustomPrompt(document.getElementById("new-prompt").value);
      }
    });

    // Escape closes the Appearance card on a laptop.
    document.addEventListener("keydown", (event) => {
      if (event.key === "Escape" && appearanceOpen) ACTIONS["appearance-toggle"]();
    });

    // Save when the app is hidden or closed; check for a new day when it comes back.
    document.addEventListener("visibilitychange", () => {
      if (document.hidden) flushSave();
      else checkForNewDay();
    });
    window.addEventListener("pagehide", flushSave);
    window.addEventListener("focus", checkForNewDay);

    // If following the phone, switch when the phone switches.
    phonePrefersLight.addEventListener("change", applyTheme);

    // Start on Today.
    applyTheme();
    showView("today");
  </script>
</body>
</html>
